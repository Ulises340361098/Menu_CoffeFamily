<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coffee Family • Menú</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tipografía Apple Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #070709;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Degradados y orbes de luz estilo Apple Event Dark */
    .glow-purple {
      position: fixed;
      top: -15%;
      left: -20%;
      width: 65vw;
      height: 65vw;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.45) 0%, rgba(124, 58, 237, 0) 70%);
      filter: blur(100px);
      z-index: -1;
      pointer-events: none;
    }

    .glow-blue {
      position: fixed;
      top: 25%;
      right: -25%;
      width: 70vw;
      height: 70vw;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.4) 0%, rgba(37, 99, 235, 0) 70%);
      filter: blur(110px);
      z-index: -1;
      pointer-events: none;
    }

    .glow-magenta {
      position: fixed;
      bottom: -15%;
      left: 10%;
      width: 65vw;
      height: 65vw;
      background: radial-gradient(circle, rgba(192, 38, 211, 0.35) 0%, rgba(192, 38, 211, 0) 70%);
      filter: blur(120px);
      z-index: -1;
      pointer-events: none;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Cristal oscuro traslúcido */
    .apple-glass-dark {
      background: rgba(10, 10, 14, 0.7) !important;
      backdrop-filter: blur(25px) saturate(190%);
      -webkit-backdrop-filter: blur(25px) saturate(190%);
    }
  </style>
</head>

<body class="text-white font-sans pb-24 antialiased selection:bg-purple-500 selection:text-white">

  <!-- Luces ambientales de fondo -->
  <div class="glow-purple"></div>
  <div class="glow-blue"></div>
  <div class="glow-magenta"></div>

  <!-- Header Minimalista -->
  <header class="pt-14 pb-8 px-6 text-center max-w-md mx-auto">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-white/[0.06] p-2 shadow-[0_8px_30px_rgba(0,0,0,0.5)] border border-white/10 mb-4 transition-transform active:scale-95 duration-200 backdrop-blur-xl">
      <img 
        src="logo.png" 
        alt="Coffee Family" 
        class="w-full h-full object-contain rounded-2xl"
        onerror="this.style.display='none'; document.getElementById('alt-icon').style.display='block';"
      >
      <span id="alt-icon" style="display:none;" class="text-2xl">☕</span>
    </div>

    <h1 class="text-3xl font-bold tracking-tight text-white">Coffee Family</h1>
    <p class="text-slate-400 text-[13px] font-medium tracking-normal mt-1">Cafetería & Crepería de Especialidad</p>
  </header>

  <!-- Pestañas de Navegación Sticky -->
  <nav class="sticky top-0 z-30 apple-glass-dark border-b border-white/[0.08] py-2.5 px-4">
    <div id="category-tabs" class="flex gap-1.5 overflow-x-auto no-scrollbar max-w-md mx-auto"></div>
  </nav>

  <!-- Contenedor del Menú -->
  <main class="max-w-md mx-auto px-4 mt-8">
    <div id="menu-container" class="space-y-10"></div>

    <!-- Footer Discreto -->
    <footer class="mt-16 text-center text-slate-500 text-[11px] font-medium tracking-wide">
      <p>© Coffee Family • Todos los derechos reservados</p>
      <p class="mt-0.5 opacity-80">Precios en MXN en pago en efectivo o transferencia</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
